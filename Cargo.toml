[workspace]
members = ["crates/*"]
# Virtual manifests have no edition, so resolver 3 must be explicit.
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/binado/bibx"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Version is required so cargo publish can rewrite path deps for crates.io.
bibx-parser = { path = "crates/bibx-parser", version = "0.1.0" }
bibx-core = { path = "crates/bibx-core", version = "0.1.0" }

[profile.release]
lto = "thin"
strip = true
