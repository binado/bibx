name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        rust: ["1.88", stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --all-features
      # Enforce crate boundaries: the parser has no runtime deps, core stays clap-free.
      - name: Dependency boundary
        run: |
          if [ "$(cargo tree -p bibx-parser --edges normal | wc -l)" -ne 1 ]; then
            echo "::error::bibx-parser must have no normal dependencies"
            cargo tree -p bibx-parser --edges normal
            exit 1
          fi
          if cargo tree -p bibx-core --edges normal | grep -q clap; then
            echo "::error::bibx-core must not depend on clap"
            cargo tree -p bibx-core --edges normal
            exit 1
          fi
      # --lib avoids a target/doc collision between a lib and a bin with the same name.
      - run: cargo doc --workspace --no-deps --lib --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Create crate packages
        run: cargo package --workspace --locked --no-verify
      - name: Verify local CLI installation
        run: cargo install --path crates/bibx --locked
