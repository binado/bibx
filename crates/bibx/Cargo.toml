[package]
name = "bibx"
description = "Manage and validate a BibTeX file from the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bibx"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bibx-core.workspace = true
clap.workspace = true
comfy-table.workspace = true
serde_json.workspace = true

[dev-dependencies]
bibx-core = { workspace = true, features = ["testing"] }
flate2.workspace = true
tar.workspace = true
tempfile.workspace = true
assert_cmd = "2"
predicates = "3"
datatest-stable = "0.3.3"
bibx-mdtest = { path = "../mdtest" }

[[test]]
name = "mdtest"
harness = false
