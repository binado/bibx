[package]
name = "bibx-core"
description = "Model, identifiers, providers and operations behind the bibx CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["arxiv", "inspire"]
arxiv = ["dep:directories", "dep:flate2", "dep:tar", "dep:ureq"]
inspire = ["dep:ureq"]
# An in-process HTTP server for tests of crates that use providers.
testing = []

[dependencies]
biblatex.workspace = true
bibx-parser.workspace = true
directories = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
indexmap.workspace = true
tar = { workspace = true, optional = true }
tempfile.workspace = true
thiserror.workspace = true
ureq = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]

[[test]]
name = "inspire"
required-features = ["inspire", "testing"]
