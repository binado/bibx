[package]
name = "bibx-core"
description = "Model, identifiers, providers and operations behind the bibx CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["inspire"]
inspire = ["dep:ureq"]
# An in-process HTTP server for tests of crates that use providers.
testing = []

[dependencies]
biblatex.workspace = true
bibx-parser.workspace = true
indexmap.workspace = true
tempfile.workspace = true
thiserror.workspace = true
ureq = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]

[[test]]
name = "inspire"
required-features = ["inspire", "testing"]
